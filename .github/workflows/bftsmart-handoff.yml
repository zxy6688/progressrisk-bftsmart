name: bftsmart-handoff

on:
  workflow_dispatch:
    inputs:
      trials:
        description: "Independent matched no-op/reconfiguration pairs per state size"
        required: true
        default: "1"
      state_sizes:
        description: "Comma-separated snapshot sizes in bytes"
        required: true
        default: "1048576"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout official BFT-SMaRt v2.0
        run: git clone --depth 1 --branch v2.0 https://github.com/bft-smart/library.git third_party/bftsmart
      - name: Run isolated membership-handoff smoke test
        env:
          BFTSMART_HOME: ${{ github.workspace }}/third_party/bftsmart
          RESULTS_DIR: ${{ github.workspace }}/bftsmart_handoff_results
          TRIALS: ${{ inputs.trials }}
          STATE_SIZES: ${{ inputs.state_sizes }}
          PROBE_SECONDS: "30"
          WARMUP_SECONDS: "4"
          VIEW_TIMEOUT_SECONDS: "30"
          PORT_BASE: "21000"
        run: |
          set +e
          bash production/run_bftsmart_handoff_benchmark.sh
          rc=$?
          echo "===== HANDOFF LOGS ====="
          find bftsmart_handoff_results -type f -name '*.log' -print -exec tail -n 100 {} \; || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bftsmart-handoff-results
          path: bftsmart_handoff_results
          if-no-files-found: warn
